name: Secret scan

# Scans every commit reachable from any branch or tag, not just the diff of a
# pull request: a secret pushed once stays in history after the file is edited.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: '8.30.1'
      # Published in gitleaks_8.30.1_checksums.txt for the linux_x64 archive.
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - name: Check out all history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The scan does not need to push, and a token written into .git/config
          # is itself a credential sitting in the tree being scanned.
          persist-credentials: false

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }} (checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o "$archive" "${base}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          rm "$archive"
          "${RUNNER_TEMP}/gitleaks/gitleaks" version

      - name: Scan
        # --redact replaces every matched value in the log, so a failing run
        # names the file, commit and rule without ever printing the credential.
        # No report is uploaded as an artifact for the same reason: the job log
        # is the only output, and it is redacted.
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gitleaks/gitleaks" git . \
            --config .gitleaks.toml \
            --log-opts="--all --full-history" \
            --redact --no-banner --no-color \
            --exit-code 1